# accelerate config: one process per GPU, DistributedDataParallel.
# num_processes / gpu ids are supplied on the command line by vla_pi05.train.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
enable_cpu_affinity: false
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: 'no'   # pi0.5 manages its own bf16 weights via --policy.dtype=bfloat16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
