[workspace]
authors = ["0scarj1ang <pjiang347@gmail.com>"]
channels = ["conda-forge"]
name = "agent_training"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
doctor = "python -m relative_dp.cli doctor"
test = "python -m pytest -q"
collect-round1 = "python -m relative_dp.cli collect"
train-round1 = "python -m relative_dp.cli train"
evaluate-round1 = "python -m relative_dp.cli evaluate"
report-round1 = "python -m relative_dp.cli report"
round1 = "python -m relative_dp.cli round1"
round2-preflight = "python -m round2.cli preflight"
round2-calibrate = "python -m round2.cli calibrate"
round2-collect = "python -m round2.cli collect"
round2-train = "python -m round2.cli train"
round2-evaluate = "python -m round2.cli evaluate"
round2-report = "python -m round2.cli report"
round2 = "python -m round2.cli all"
round3-prepare = "python -m round3.cli prepare"
round3-validate-proposals = "python -m round3.cli validate-proposals"
round3-train = "python -m round3.cli train"
round3-dev-eval = "python -m round3.cli dev-eval"
round3-test = "python -m round3.cli test"
round3-report = "python -m round3.cli report"
round3-resume = "python -m round3.cli resume"
round3 = "python -m round3.cli all"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
relative-dp-round1 = { path = ".", editable = true }
metaworld = { git = "https://github.com/Farama-Foundation/Metaworld.git", rev = "6e01ad7e2ffb2302e4dca04f796fcd8837df8540" }
mujoco = "==3.3.0"
torch = "==2.7.1"
diffusers = "==0.35.1"
gymnasium = "==1.2.0"
numpy = "==2.2.6"
scipy = "==1.15.3"
einops = "==0.8.1"
h5py = "==3.14.0"
matplotlib = "==3.10.3"
imageio = "==2.37.0"
imageio-ffmpeg = "==0.6.0"
pytest = "==8.4.1"

[activation.env]
MUJOCO_GL = "egl"
CUDA_VISIBLE_DEVICES = "0,1,2,3"
MUJOCO_EGL_DEVICE_ID = "0"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
PYTHONUNBUFFERED = "1"

# ---------------------------------------------------------------------------
# VLA (pi0.5) fine-tuning environment. Isolated from the frozen default
# environment: run with `pixi run -e vla <task>`. Python 3.12 because
# lerobot>=0.6 requires it; torch pinned to the CUDA 12.6 build that is known
# to work on this host's driver.
# ---------------------------------------------------------------------------
[feature.vla.dependencies]
python = "3.12.*"
ffmpeg = ">=7.1,<8"

[feature.vla.pypi-dependencies]
relative-dp-round1 = { path = ".", editable = true }
torch = "==2.7.1"
torchvision = "==0.22.1"
torchcodec = "==0.4.0"
lerobot = { version = "==0.6.1", extras = ["pi", "training", "dataset", "peft"] }
websockets = ">=13.0"
msgpack = ">=1.0.5"
matplotlib = ">=3.10"
pytest = ">=8.0"
sentencepiece = ">=0.2.0"
protobuf = ">=4"

[feature.vla.activation.env]
# VLA work uses physical GPUs 4-7 (user request 2026-09-20); GPUs 0-3 stay with Round 3.
CUDA_VISIBLE_DEVICES = "4,5,6,7"
PYTHONUNBUFFERED = "1"
TOKENIZERS_PARALLELISM = "false"
OMP_NUM_THREADS = "4"

[feature.vla.tasks]
vla-doctor = "python -m vla_pi05.cli doctor"
vla-manifest = "python -m vla_pi05.cli manifest"
vla-convert = "python -m vla_pi05.cli convert"
vla-train = "python -m vla_pi05.cli train"
vla-eval = "python -m vla_pi05.cli eval"
vla-serve = "python -m vla_pi05.cli serve"
vla-test = "python -m pytest -q tests/test_vla_pi05.py"

[environments]
vla = { features = ["vla"], no-default-feature = true }
