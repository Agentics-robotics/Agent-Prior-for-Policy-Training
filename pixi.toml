[workspace]
authors = ["0scarj1ang <pjiang347@gmail.com>"]
channels = ["conda-forge"]
name = "agent_training"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m pytest -q"
experiment1-preflight = "python -m experiment1.cli preflight"
experiment1-run = "python -m experiment1.cli run"
experiment1-status = "python -m experiment1.cli status"
experiment1-report = "python -m experiment1.cli report"
experiment1-freeze = "python -m experiment1.cli freeze"
experiment1-api-smoke = "python -m experiment1.cli smoke"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
relative-dp-round1 = { path = ".", editable = true }
metaworld = { git = "https://github.com/Farama-Foundation/Metaworld.git", rev = "6e01ad7e2ffb2302e4dca04f796fcd8837df8540" }
mujoco = "==3.3.0"
torch = "==2.7.1"
diffusers = "==0.35.1"
gymnasium = "==1.2.0"
numpy = "==2.2.6"
scipy = "==1.15.3"
einops = "==0.8.1"
h5py = "==3.14.0"
matplotlib = "==3.10.3"
imageio = "==2.37.0"
imageio-ffmpeg = "==0.6.0"
pytest = "==8.4.1"

[activation.env]
MUJOCO_GL = "egl"
CUDA_VISIBLE_DEVICES = "4,5,6,7"
CUDA_DEVICE_ORDER = "PCI_BUS_ID"
MUJOCO_EGL_DEVICE_ID = "4"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
PYTHONUNBUFFERED = "1"

[environments]
default = { features = [] }
