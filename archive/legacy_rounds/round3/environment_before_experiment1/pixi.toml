[workspace]
authors = ["0scarj1ang <pjiang347@gmail.com>"]
channels = ["conda-forge"]
name = "agent_training"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
doctor = "python -m relative_dp.cli doctor"
test = "python -m pytest -q"
collect-round1 = "python -m relative_dp.cli collect"
train-round1 = "python -m relative_dp.cli train"
evaluate-round1 = "python -m relative_dp.cli evaluate"
report-round1 = "python -m relative_dp.cli report"
round1 = "python -m relative_dp.cli round1"
round2-preflight = "python -m round2.cli preflight"
round2-calibrate = "python -m round2.cli calibrate"
round2-collect = "python -m round2.cli collect"
round2-train = "python -m round2.cli train"
round2-evaluate = "python -m round2.cli evaluate"
round2-report = "python -m round2.cli report"
round2 = "python -m round2.cli all"
round3-prepare = "python -m round3.cli prepare"
round3-validate-proposals = "python -m round3.cli validate-proposals"
round3-train = "python -m round3.cli train"
round3-dev-eval = "python -m round3.cli dev-eval"
round3-test = "python -m round3.cli test"
round3-report = "python -m round3.cli report"
round3-resume = "python -m round3.cli resume"
round3 = "python -m round3.cli all"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
relative-dp-round1 = { path = ".", editable = true }
metaworld = { git = "https://github.com/Farama-Foundation/Metaworld.git", rev = "6e01ad7e2ffb2302e4dca04f796fcd8837df8540" }
mujoco = "==3.3.0"
torch = "==2.7.1"
diffusers = "==0.35.1"
gymnasium = "==1.2.0"
numpy = "==2.2.6"
scipy = "==1.15.3"
einops = "==0.8.1"
h5py = "==3.14.0"
matplotlib = "==3.10.3"
imageio = "==2.37.0"
imageio-ffmpeg = "==0.6.0"
pytest = "==8.4.1"

[activation.env]
MUJOCO_GL = "egl"
CUDA_VISIBLE_DEVICES = "0,1,2,3"
MUJOCO_EGL_DEVICE_ID = "0"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
PYTHONUNBUFFERED = "1"

# Round 4 uses the same Pixi workspace with an isolated dependency set.
# The default MetaWorld environment remains pinned above.
[feature.round4.dependencies]
python = "3.11.*"

[feature.round4.pypi-dependencies]
relative-dp-round1 = { path = ".", editable = true }
mani-skill = "==3.0.1"
sapien = "==3.0.3"
torch = "==2.7.1"
numpy = "==1.26.4"
scipy = "==1.15.3"
gymnasium = "==1.2.0"
diffusers = "==0.35.1"
einops = "==0.8.1"
h5py = "==3.14.0"
matplotlib = "==3.10.3"
imageio = "==2.37.0"
imageio-ffmpeg = "==0.6.0"
opencv-python = "==4.11.0.86"
pytest = "==8.4.1"

[feature.round4.activation.env]
CUDA_VISIBLE_DEVICES = "0,1,2,3"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
PYTHONUNBUFFERED = "1"
SSL_CERT_FILE = "/etc/ssl/certs/ca-certificates.crt"
REQUESTS_CA_BUNDLE = "/etc/ssl/certs/ca-certificates.crt"
MS_ASSET_DIR = "/home/users/oscar/agent_learning/Agent-Prior-for-Policy-Training/round4/assets"
VK_ICD_FILENAMES = "/usr/share/vulkan/icd.d/nvidia_icd.json"

[environments]
default = { features = [] }
round4 = { features = ["round4"], no-default-feature = true }
